server {
    listen 80;
    listen [::]:80;
    server_name launcher.unitedbangla.top;

    client_max_body_size 8m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name launcher.unitedbangla.top;

    ssl_certificate /etc/letsencrypt/live/launcher.unitedbangla.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/launcher.unitedbangla.top/privkey.pem;
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8602;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
